name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep the in-memory MongoDB binary outside node_modules (npm ci wipes it)
      # so actions/cache can restore it between runs.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which rejects lockfiles written by npm 11
      # (used locally). Match the lockfile's npm so `npm ci` accepts it.
      - run: npm install -g npm@11

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
